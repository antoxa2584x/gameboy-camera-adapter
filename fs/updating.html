<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Updating...</title>
    <link rel="icon" type="image/png" href="img/favicon-96x96.png" sizes="96x96">
    <link rel="apple-touch-icon" sizes="192x192" href="img/web-app-manifest-192x192.png">
    <meta name="apple-mobile-web-app-title" content="GameBoy Camera Adapter">
    <link rel="manifest" href="img/site.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <meta name="application-name" content="GameBoy Camera Adapter">
    <meta name="msapplication-TileColor" content="#ece6e6">
    <meta name="theme-color" content="#ece6e6">
    <script>
        async function checkOnline() {
            try {
                const response = await fetch('/status.json', { cache: "no-store" });
                if (response.ok) {
                    window.location.href = '/';
                }
            } catch (e) {
                // Ignore errors (device still offline)
            }
        }

        // Wait 5 seconds before starting to poll
        setTimeout(() => {
            // Poll every 3 seconds
            setInterval(checkOnline, 3000);
            // Also check immediately after delay
            checkOnline();
        }, 5000);
    </script>
    <style>
        /* local subset font (browser usually has it cached from the main page;
           the device is offline during the update, so no external font CDN) */
        @font-face {
            font-family: 'Press Start 2P';
            src: url('fonts/PressStart2P-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            text-align: center;
            background-color: #266d3f;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            font-size: 1.5rem;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .message {
            margin-bottom: 2rem;
        }

        .shaking-link {
            font-size: 3rem;
            color: white;
            text-decoration: underline;
            display: inline-block; /* REQUIRED */
            animation: shake 0.15s infinite;
        }

        @keyframes shake {
            0% {
                transform: translateY(1px);
            }

            25% {
                transform: translateX(-1px);
            }

            50% {
                transform: translateX(1px);
            }

            75% {
                transform: translateY(-1px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
<p class="message">
    If nothing caught fire after the update,<br>
    feel free to click
</p>

<a class="shaking-link" href="/">UPDATE IS FINISHED</a>
</body>
</html>
