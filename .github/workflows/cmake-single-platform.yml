name: Compile Raspberry Pi Pico Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # A stuck step (e.g. a slow package mirror) fails here instead of hanging for 6 h
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ARM's own toolchain (newlib included) instead of apt: the Ubuntu mirror
    # once kept the install step running for 20+ minutes. cmake comes with the runner.
    - name: Install ARM toolchain
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '13.2.Rel1'

    - name: Set up Pico SDK
      run: |
        git clone -b master https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=$PWD" >> $GITHUB_ENV

    - name: Build project
      env:
        PICO_SDK_PATH: ${{ env.PICO_SDK_PATH }}
      run: |
        mkdir -p build
        gcc -o build/makefsdata -I$PICO_SDK_PATH/lib/lwip/src/include/ -Iinclude -I. makefsdata/makefsdata.c
        ./build/makefsdata ./fs -f:include/pico_printer_fs.c
        cd build
        cmake ..
        make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pico-gb-printer-firmware
        path: build/pico_gb_printer.uf2